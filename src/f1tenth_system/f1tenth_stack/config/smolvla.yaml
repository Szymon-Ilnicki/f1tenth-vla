smolvla_openloop:
  ros__parameters:
    policy_id: "lerobot/smolvla_base"
    device: "cuda"
    model_path: "outputs/smoke/checkpoints/last/pretrained_model"
    image_topic: "/camera/camera/color/image_raw"
    task: "drive forward"
    rate_hz: 2.0
    n_action_steps: 5
    #max_speed: 0.5
    #max_steer: 0.35

smolvla_to_drive:
  ros__parameters:
    action_topic: /smolvla/action
    drive_topic: /drive
    speed_min: 0.0
    speed_max: 1.0
    steer_max: 0.4
    stale_s: 0.5
