smolvla_openloop:
  ros__parameters:
    policy_id: "lerobot/smolvla_base"
    device: "cuda"
    #model_path: "" #blank for SmolVLA base model
    model_path: "models/track_v5"
    mode: dual # rgb | depth | dual
    task: "complete laps around the track anticlockwise"
    image_topic: "/camera/camera/color/image_raw"
    rate_hz: 10.0        # = dataset fps; one action every 0.1 s
    n_action_steps: 40   # max actions used from one chunk; must exceed 2 x (inference time + lead_s) x rate_hz
    lead_s: -1.0          # extra look-ahead [s] on top of the measured inference delay, for actuator lag
    max_image_age_s: 0.5 # stop planning (and stop the car) if camera frames are older than this
    precision: "fp32"    # fp32 | fp16 | bf16 -- reduced precision via autocast; check with vla_replay --precision first
    publish_chunk: true  # full plan on /smolvla/chunk_steer and /smolvla/chunk_speed (Foxglove: Plot, x-axis = index)
    num_steps: 5         # denoising steps per inference; 0 = checkpoint default (10). Fewer = faster
    stats_path: ""       # empty = <model folder>/dataset_stats.json; or a path, relative to the repo root
    #max_speed: 0.5
    #max_steer: 0.35

smolvla_to_drive:
  ros__parameters:
    action_topic: /smolvla/action
    drive_topic: /drive
    speed_min: 0.0
    speed_max: 1.2
    steer_max: 0.4
    stale_s: 0.5
