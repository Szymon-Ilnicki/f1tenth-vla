smolvla_openloop:
  ros__parameters:
    policy_id: "lerobot/smolvla_base"
    device: "cuda"
    #model_path: "" #blank for SmolVLA base model
    model_path: "models/track_v3_dual-image"
    mode: dual # rgb | depth | dual
    task: "complete laps around the track anticlockwise"
    image_topic: "/camera/camera/color/image_raw"
    rate_hz: 10.0        # = dataset fps; one action every 0.1 s
    n_action_steps: 40   # max actions used from one chunk; must exceed 2 x (inference time + lead_s) x rate_hz
    lead_s: 0.0          # extra look-ahead [s] on top of the measured inference delay, for actuator lag
    num_steps: 0         # denoising steps per inference; 0 = checkpoint default (10). Fewer = faster
    stats_path: "/home/hwf1tenth/szymon_ws/f1tenth-vla/models/track_v3_dual-image/dataset_stats.json"
    #max_speed: 0.5
    #max_steer: 0.35

smolvla_to_drive:
  ros__parameters:
    action_topic: /smolvla/action
    drive_topic: /drive
    speed_min: 0.0
    speed_max: 1.0
    steer_max: 0.4
    stale_s: 0.5
